[project]
name = "drift"
version = "0.1.0"
description = "Content pipeline build system — prove what changed, rebuild only what is stale."
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drift = "drift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
